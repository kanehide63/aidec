<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7faff">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="AIDEC Navigator ログインページ">
  <title>AIDEC Navigator | ログイン</title>
  <link rel="icon" href="aidec-navigator-logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="navigator.css?v=1.0">
  <script src="navigator-config.js" defer></script>
  <script src="navigator.js" defer></script>
</head>
<body class="navigator-intro-pending">
  <a class="navigator-skip-link" href="#navigator-login">ログインフォームへ移動</a>
  <section class="navigator-brand-intro" id="navigator-brand-intro" aria-label="AIDEC Navigator ブランドイントロ">
    <div class="navigator-intro-stage" aria-hidden="true">
      <div class="navigator-intro-symbol">
        <img class="navigator-intro-base" src="aidec-navigator-intro-base.png" alt="" width="1280" height="1280">
        <img class="navigator-intro-orbit" src="aidec-navigator-intro-orbit.png" alt="" width="1280" height="1280">
        <img class="navigator-intro-final" src="aidec-navigator-symbol.jpg" alt="" width="1280" height="1280">
        <span class="navigator-intro-dot-glow"></span>
      </div>
    </div>
  </section>
  <main class="navigator-page">
    <section class="navigator-login-card" id="navigator-login" aria-labelledby="navigator-login-title">
      <h1 id="navigator-login-title" class="visually-hidden">AIDEC Navigator ログイン</h1>
      <img class="navigator-logo" src="aidec-navigator-logo.jpg" alt="AIDEC Navigator" width="1280" height="1280">
      <p class="navigator-guidance">ご契約時にお渡ししたID・Passwordをご入力のうえ、ログインしてください。</p>

      <form class="navigator-login-form" id="navigator-login-form" method="post" novalidate>
        <div class="navigator-field">
          <label for="navigator-id">ID</label>
          <input id="navigator-id" name="navigator-id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="navigator-field">
          <label for="navigator-password">Password</label>
          <input id="navigator-password" name="navigator-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="navigator-login-button" type="submit">ログイン</button>
        <p class="navigator-login-message" id="navigator-login-message" role="status" aria-live="polite" hidden></p>
      </form>

      <a class="navigator-back-link" href="index.html">AIDEC公式ホームページへ戻る</a>
    </section>
  </main>
</body>
</html>
