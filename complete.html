<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f2742">
  <meta name="aidec-google-analytics-id" content="">
  <meta name="robots" content="noindex">
  <title>お申し込み完了｜AIDEC</title>
  <link rel="icon" href="aidec-symbol.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="style.css?v=2.4">
</head>
<body data-page="application-complete">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="AIDEC トップへ">
        <img src="aidec-symbol.jpeg" alt="AIDEC ブランドシンボル" class="brand-logo">
        <span class="brand-copy"><strong>AIDEC</strong><small>AI-Driven Enterprise Compass &amp; Consulting</small></span>
      </a>
      <a class="form-back-link" href="index.html">ホームへ戻る</a>
    </div>
  </header>
  <main class="application-page">
    <section class="application-section">
      <div class="container form-shell">
        <ol class="form-progress" aria-label="お申し込みの進行状況">
          <li class="is-complete"><span>1</span>入力</li>
          <li class="is-complete"><span>2</span>確認</li>
          <li class="is-active" aria-current="step"><span>3</span>完了</li>
        </ol>
        <section class="form-panel completion-panel" aria-labelledby="complete-title">
          <div class="completion-icon" aria-hidden="true">✓</div>
          <p class="section-label">Completed</p>
          <h1 id="complete-title">お申し込みありがとうございます。</h1>
          <p class="completion-message">内容を確認のうえ、<strong>2～3営業日以内にご連絡いたします。</strong></p>
          <p>ご入力いただいたメールアドレスへ受付完了メールをお送りしました。</p>
          <p class="completion-help">受付完了メールが見当たらない場合は、迷惑メールフォルダーもご確認ください。</p>
          <a class="button button-primary" href="index.html">ホームへ戻る</a>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer form-footer">
    <div class="container footer-bottom"><p>© <span id="year"></span> AIDEC. All Rights Reserved.</p><a href="privacy.html">プライバシーポリシー</a></div>
  </footer>
  <script src="script.js?v=2.2"></script>
</body>
</html>
